<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Attendance">
  <defs>
    <radialGradient id="bgGlowAtt" cx="50%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#13284C"/>
      <stop offset="55%" stop-color="#0B1730"/>
      <stop offset="100%" stop-color="#060C1A"/>
    </radialGradient>
    <linearGradient id="attBrass" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#B4781E"/>
      <stop offset="50%" stop-color="#D9A54A"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>
    <linearGradient id="attEmerald" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#6EE7B7"/>
    </linearGradient>
    <linearGradient id="bustGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="72%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <radialGradient id="attHalo" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#D9A54A" stop-opacity="0.22"/>
      <stop offset="65%" stop-color="#10B981" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0B1730" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="portraitClip">
      <circle cx="256" cy="256" r="121"/>
    </clipPath>
  </defs>

